<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#080808">
<meta property="og:title" content="{{title}}"><meta property="og:description" content="{{description}}"><meta property="og:type" content="website">
{{canonical}}
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/design.css">
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="pg-catalog">
<a class="skip" href="#main">К содержимому</a>
<div style="background: #080808; color: #F5F1E8; min-height: 100vh">
<!--@header-->
<main id="main">
<div class="wrap" style="padding-top: 40px; padding-bottom: 120px">
<nav class="crumbs" aria-label="Хлебные крошки"><a href="/">Главная</a><i></i><span style="color: #CFCAC0">Каталог</span></nav>

<div class="cat-head" style="display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; flex-wrap: wrap; margin: 28px 0 48px">
<div style="display: flex; flex-direction: column; gap: 14px">
<h1 class="display d1" style="font-size: clamp(44px, 4.4vw, 64px)">Коллекция ароматов</h1>
<p class="small" id="count-label" style="margin: 0; font-size: 14px" aria-live="polite">&nbsp;</p>
</div>
<div class="search" style="flex: 0 1 420px; min-width: 260px">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
<label for="q" class="vh">Поиск по названию или бренду</label>
<input id="q" class="input" type="search" placeholder="Название аромата или бренд" autocomplete="off" enterkeyhint="search">
<button type="button" class="search-cam" id="photo-btn" aria-label="Найти аромат по фото" title="Найти по фото"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
<input type="file" id="photo-file" accept="image/*" capture="environment" hidden>
</div>
</div>

<div class="layout">
<aside class="aside" aria-label="Фильтры" id="filters-desktop"></aside>

<div class="content">
<div class="toolbar" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding-bottom: 24px; margin-bottom: 36px; border-bottom: 1px solid rgba(245,241,232,.08)">
<div class="active-row" id="active-row"></div>
<div style="display: flex; align-items: center; gap: 12px">
<button class="btn-ghost sm fbtn" type="button" id="filters-open" aria-haspopup="dialog"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Фильтры<span class="count-chip" id="filters-count" hidden></span></button>
<label for="sort" class="small sort-label">Сортировка</label>
<select id="sort" class="sel">
<option value="pop">По популярности</option>
<option value="asc">Сначала дешевле</option>
<option value="desc">Сначала дороже</option>
</select>
</div>
</div>
<div id="results" aria-live="polite"></div>
</div>
</div>
</div>

<div id="fpanel-wrap" class="fpanel-wrap" hidden>
<div class="backdrop" id="fpanel-backdrop"></div>
<div class="fpanel" id="fpanel" role="dialog" aria-modal="true" aria-label="Фильтры">
<div class="handle"><span></span></div>
<div class="fp-head"><span style="font: 500 28px/1 'Cormorant Garamond', serif">Фильтры</span><button class="ibtn" type="button" id="fpanel-close" aria-label="Закрыть фильтры"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<div class="fp-body" id="fpanel-body"></div>
<div class="fp-foot"><button class="btn-ghost" type="button" id="fpanel-reset" style="padding: 0 12px">Сбросить</button><button class="btn" type="button" id="fpanel-apply" style="padding: 0 12px">Показать</button></div>
</div>
</div>
</main>
<!--@footer-->
</div>
<!--@menu-->
<script type="module" src="/js/catalog.js"></script>
</body>
</html>
